<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Tarjeta de Perfil</title>

    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Urbanist:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <!-- Nuestro archivo de estilos -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>

    <!-- TARJETA PRINCIPAL -->
    <div class="tarjeta">

      <!-- SECCIÓN 1: Avatar y nombre -->
      <div class="perfil-top">
        <img
          class="avatar"
          src="https://ui-avatars.com/api/?name=J+M&background=0a0a0f&color=d4af37&size=256&bold=true"  
          alt="Logo JM_Photo"
        />
        <div class="perfil-info">
          <h1 class="nombre">Jerson Martinez Zambrano</h1>
          <p class="rol">Street Photographer</p>
        </div>
      </div>

      <!-- SECCIÓN 2: Bio -->
      <p class="bio">
        Apasionado de la fotografia, Cazador de momentos invisibles. Encuentro el orden en el caos de la ciudad y convierto lo cotidiano en historias.
		La calle es mi galería. 📷
      </p>

      <!-- SECCIÓN 3: Estadísticas -->
      <div class="stats">
        <div class="stat">
          <span class="stat-numero">2</span>
          <span class="stat-label">Proyectos</span>
        </div>
        <div class="stat">
          <span class="stat-numero">4</span>
          <span class="stat-label">Semanas</span>
        </div>
        <div class="stat">
          <span class="stat-numero">100</span>
          <span class="stat-label">% Activo</span>
        </div>
      </div>

      <!-- SECCIÓN 4: Botones -->
      <div class="acciones">
        <button class="btn btn-primario">Suscribirse</button>
        <button class="btn btn-secundario">Contactar</button>
      </div>

    </div>

  </body>

</html>
